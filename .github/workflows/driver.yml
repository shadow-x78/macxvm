name: driver

# ── Triggers ──
on:
  push:
    paths:
      - 'driver/**'
      - 'internal/driver/**'
      - 'resources/mxgpu-release-public-key.txt'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'driver/**'
      - 'internal/driver/**'
      - 'resources/mxgpu-release-public-key.txt'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

# ── Jobs ──
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the lock file and the headers
        run: make -C driver test-host

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the syntax of the installer scripts
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files 'driver/installer/*.sh')
      - name: Run the packaging self-test
        run: |
          report="$(go run ./driver/tests/packaging/main.go)"
          printf '%s\n' "$report"
          [ "$(printf '%s\n' "$report" | grep -c '\[ok\]')" -eq 5 ]
      - name: Check the guard of a stale staging directory
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          mkdir -p "$work/driver/build" "$work/driver/dist" "$work/driver/installer" "$work/artifacts/mxgpu/package"
          cp driver/installer/*.sh "$work/driver/installer/"
          printf '{"components":[]}\n' >"$work/driver/third_party.lock.json"
          printf 'notice\n' >"$work/driver/NOTICE"
          printf 'one\n' >"$work/driver/build/payload"
          bash "$work/driver/installer/package.sh" mxgpu-release-2026 >/dev/null
          printf 'signature\n' >"$work/driver/dist/mxgpu-staging/manifest.sig"
          printf 'two\n' >"$work/driver/build/payload"
          if bash "$work/driver/installer/package.sh" mxgpu-release-2026 >/dev/null 2>&1; then
            echo "the packager archived a staging directory of another build" >&2
            exit 1
          fi
          echo "the packager refuses the signature of another build"
