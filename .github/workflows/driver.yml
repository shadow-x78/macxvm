name: driver

# ── Triggers ──
on:
  push:
    paths:
      - 'driver/**'
      - 'internal/driver/**'
      - 'resources/mxgpu-release-public-key.txt'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'driver/**'
      - 'internal/driver/**'
      - 'resources/mxgpu-release-public-key.txt'
      - '.github/workflows/driver.yml'
  workflow_dispatch:

# ── Jobs ──
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the lock file and the headers
        run: make -C driver test-host

  builder:
    runs-on: macos-14
    if: hashFiles('driver/kexts/MXRM/Makefile') != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build and test the driver
        env:
          ARCHS: x86_64
          SDKROOT: macosx
        run: make -C driver build test
      - name: Build the package
        run: make -C driver package
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: mxgpu-driver
          path: driver/dist/*.tar.gz
          if-no-files-found: error
