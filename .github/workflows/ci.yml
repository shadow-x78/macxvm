# ─────────────────────────────────────────────
# MacXVM - CI Workflow
# https://github.com/shadow-x78/macxvm
# ─────────────────────────────────────────────

name: ci

# ── Triggers ──
on:
  push:
  pull_request:
  workflow_dispatch:

# ── Jobs ──
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the formatting
        run: test -z "$(gofmt -l .)"
      - name: Check the file headers
        run: ./scripts/check-headers.sh
      - name: Check shell syntax
        run: |
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files '*.sh')
      - name: Check the workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Vet, test and build
        run: go vet ./... && go test ./... && make build
      - name: Check the lock file of the driver
        run: make -C driver test-host
      - name: Check the size of the binary
        run: |
          size=$(stat -c %s bin/macxvm)
          echo "the binary is $size bytes"
          test "$size" -lt 10485760
