# ─────────────────────────────────────────────
# MacXVM - CI Workflow
# https://github.com/shadow-x78/macxvm
# ─────────────────────────────────────────────

name: ci

# ── Triggers ──
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Sealed base for the optional KVM integration test
        required: false
        type: string

# ── Jobs ──
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the formatting
        run: test -z "$(gofmt -l .)"
      - name: Check the file headers
        run: ./scripts/check-headers.sh
      - name: Check shell syntax
        run: bash -n scripts/bench.sh scripts/integration.sh scripts/install.sh scripts/screenshot.sh
      - name: Vet, test and build
        run: go vet ./... && go test ./... && make build
      - name: Check the size of the binary
        run: |
          size=$(stat -c %s bin/macxvm)
          echo "the binary is $size bytes"
          test "$size" -lt 8388608

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.base != ''
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Build
        run: make build
      - name: Opt-in KVM integration
        run: MACXVM_INTEGRATION=1 MACXVM_BIN=./bin/macxvm ./scripts/integration.sh "${{ inputs.base }}"
