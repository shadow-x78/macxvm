# ─────────────────────────────────────────────
# MacXVM - CI Workflow
# https://github.com/shadow-x78/macxvm
# ─────────────────────────────────────────────

# ── Workflow ──
name: ci

on:
  push:
  pull_request:

# ── Job ──
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Check the formatting
        run: test -z "$(gofmt -l .)"
      - name: Check the file headers
        run: ./scripts/check-headers.sh
      - name: Vet, test and build
        run: go vet ./... && go test ./... && make build
      - name: Check the size of the binary
        run: |
          size=$(stat -c %s bin/macxvm)
          echo "the binary is $size bytes"
          test "$size" -lt 6291456
