<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="MacXVM">
  <!-- ─────────────────────────────────────────────
       MacXVM - Social Preview (MIT)
       https://github.com/shadow-x78/macxvm
       ─────────────────────────────────────────────
       The macOS palette: system blue #007AFF, indigo
       #5E5CE6, graphite #1D1D1F and the text
       colours #F5F5F7 and #A1A1A6.
       ───────────────────────────────────────────── -->
  <defs>
    <style>
      .mxvm-f{fill:#5E5CE6;}
      .mxvm-g{fill:#007AFF;}
      .mxvm-s{fill:none;stroke:#007AFF;}
      .mxvm-t{fill:#F5F5F7;}
      .mxvm-d{fill:#A1A1A6;}
    </style>
    <linearGradient id="mxvm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D1D1F"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#mxvm-bg)"/>

  <g transform="translate(504 96) scale(0.53)">
    <rect class="mxvm-s" x="86" y="106" width="340" height="234" rx="28" stroke-width="40"/>
    <path class="mxvm-s" d="M256 340v56M186 396h140" stroke-width="40" stroke-linecap="round"/>
    <rect class="mxvm-f" x="268" y="212" width="116" height="88" rx="18"/>
    <circle class="mxvm-g" cx="126" cy="152" r="16"/>
  </g>

  <text class="mxvm-t" x="640" y="430" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-size="96" font-weight="700">MacXVM</text>
  <text class="mxvm-d" x="640" y="492" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-size="34">Slim macOS guests with Xcode on Linux</text>
  <text class="mxvm-d" x="640" y="546" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-size="26">QEMU/KVM &#183; one static binary &#183; no daemon</text>
</svg>
