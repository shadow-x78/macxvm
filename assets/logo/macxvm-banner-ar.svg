<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" xml:lang="ar" dir="rtl">
  <defs>
    <!-- Background Gradient (Apple Obsidian Space Black) -->
    <linearGradient id="bg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="50%" stop-color="#0E0E13"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>

    <!-- macOS System Blue Gradient -->
    <linearGradient id="mxvm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="50%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0062CC"/>
    </linearGradient>

    <!-- macOS System Indigo Gradient -->
    <linearGradient id="mxvm-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D7AFF"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>

    <linearGradient id="borderGradient" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#5E5CE6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Subtle Technical Blueprint Grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.025"/>
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="400" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="16" fill="url(#grid)"/>

  <!-- Clean Border Outline -->
  <rect width="1278" height="398" x="1" y="1" rx="15" fill="none" stroke="url(#borderGradient)" stroke-width="1"/>

  <!-- Right: Brand Logo Group -->
  <g transform="translate(930, 75)">
    <circle cx="125" cy="125" r="118" fill="none" stroke="#007AFF" stroke-width="1.2" opacity="0.25" stroke-dasharray="6 6"/>
    <g transform="translate(125, 125) scale(0.546) translate(-256, -256)">
      <rect x="244" y="313" width="24" height="56" fill="url(#mxvm-blue)"/>
      <rect x="184" y="357" width="144" height="24" rx="12" fill="url(#mxvm-blue)"/>
      <rect x="131" y="143" width="250" height="170" rx="20" fill="none" stroke="url(#mxvm-blue)" stroke-width="24"/>
      <circle cx="168" cy="180" r="11" fill="url(#mxvm-blue)"/>
      <rect x="267" y="223" width="88" height="64" rx="12" fill="url(#mxvm-indigo)"/>
    </g>
  </g>

  <!-- Left: Title, Subtitle, and Feature Pills -->
  <g transform="translate(0, 80)">
    <!-- Main Title: English MACXVM -->
    <text x="860" y="60" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#F5F5F7" letter-spacing="-1.5">
      MAC<tspan fill="url(#mxvm-blue)">XVM</tspan>
    </text>

    <!-- Subtitle -->
    <text x="860" y="110" text-anchor="start" direction="rtl" font-family="'Noto Sans Arabic', 'Cairo', 'SF Pro AR', sans-serif" font-size="22" font-weight="700" fill="#E4E4F0">
      شغّل ضيوف macOS خفيفين مع Xcode على مضيف Linux
    </text>

    <!-- Description Details -->
    <text x="860" y="144" text-anchor="start" direction="rtl" font-family="'Noto Sans Arabic', 'Cairo', 'SF Pro AR', sans-serif" font-size="15.5" font-weight="500" fill="#A1A1A6">
      مفتوح المصدر · محرك QEMU/KVM · ملف تنفيذي واحد · طبقات فورية
    </text>

    <!-- Feature Pills (RTL ordered from right to left, aligned cleanly to x=860) -->
    <g transform="translate(366, 180)">
      <!-- Pill 3 (Leftmost): بناء مشاريع Xcode -->
      <g transform="translate(0, 0)">
        <rect width="168" height="38" rx="10" fill="#30D158" fill-opacity="0.10" stroke="#30D158" stroke-width="1.2"/>
        <text x="126" y="19" dominant-baseline="central" text-anchor="end" font-family="'Noto Sans Arabic', 'Cairo', sans-serif" font-size="13.5" font-weight="700" fill="#30D158">بناء مشاريع Xcode</text>
        <svg x="134" y="11" width="16" height="16" viewBox="0 0 24 24" fill="#30D158">
          <path d="M 3 17.25 V 21 h 3.75 L 17.81 9.94 l -3.75 -3.75 L 3 17.25 Z M 20.71 7.04 c 0.39 -0.39 0.39 -1.02 0 -1.41 l -2.34 -2.34 c -0.39 -0.39 -1.02 -0.39 -1.41 0 l -1.83 1.83 3.75 3.75 1.83 -1.83 Z"/>
        </svg>
      </g>

      <!-- Pill 2 (Middle): لينكس x86_64 -->
      <g transform="translate(184, 0)">
        <rect width="146" height="38" rx="10" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.2"/>
        <text x="108" y="19" dominant-baseline="central" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13.5" font-weight="700" fill="#7D7AFF">لينكس x86_64</text>
        <svg x="116" y="11" width="16" height="16" viewBox="0 0 24 24" fill="#5E5CE6">
          <path d="M 20 3 L 4 3 C 2.9 3 2 3.9 2 5 L 2 15 C 2 16.1 2.9 17 4 17 L 10 17 L 10 19 L 7 19 C 6.4 19 6 19.4 6 20 C 6 20.6 6.4 21 7 21 L 17 21 C 17.6 21 18 20.6 18 20 C 18 19.4 17 19 L 14 19 L 14 17 L 20 17 C 21.1 17 22 16.1 22 15 L 22 5 C 22 3.9 21.1 3 20 3 Z M 20 15 L 4 15 L 4 5 L 20 5 L 20 15 Z"/>
        </svg>
      </g>

      <!-- Pill 1 (Rightmost): طبقات فورية -->
      <g transform="translate(346, 0)">
        <rect width="148" height="38" rx="10" fill="#007AFF" fill-opacity="0.10" stroke="#007AFF" stroke-width="1.2"/>
        <text x="110" y="19" dominant-baseline="central" text-anchor="end" font-family="'Noto Sans Arabic', 'Cairo', sans-serif" font-size="13.5" font-weight="700" fill="#2997FF">طبقات فورية</text>
        <svg x="118" y="11" width="16" height="16" viewBox="0 0 24 24" fill="#007AFF">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </g>
    </g>
  </g>
</svg>
